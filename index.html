<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="やること">
<meta name="theme-color" content="#eef1f6" id="themeColor">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

<title>やること</title>
<!--
  task-cadence-app(表示名: やること)= そろそろ(cadence: くり返しの周期予測)+ とりあえず(task: やることの消化)を1つにしたアプリ。
  ・各アプリは Shadow DOM の箱に入っていて、CSS・idは互いに混ざらない(中身のロジックは元のまま)。
  ・ログイン(同期)・更新・バックアップだけ、この共通の枠で行う。
  ・保存先は従来のまま: localStorage の cycle / motiv、Firestore の apps/cycle-tracker / apps/motivation。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    min-height: 100vh; overflow-x: hidden;
    background: var(--bg); color: var(--text);
    padding-bottom: calc(49px + env(safe-area-inset-bottom, 0px));
  }
  body[data-tab="cycle"] { --bg:#eef1f6; --card:#ffffff; --chip:#e1e6ef; --accent:#4360cc; --accentText:#ffffff; --text:#1f2940; --muted:#76829a; --bar:rgba(246,248,251,.86); --line:rgba(31,41,64,.12); }
  body[data-tab="motiv"] { --bg:#0f1020; --card:#1b1d33; --chip:#2a2d4a; --accent:#6c6cff; --accentText:#ffffff; --text:#f2f3ff; --muted:#9a9cc0; --bar:rgba(20,21,40,.86); --line:rgba(255,255,255,.14); }

  .bar { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 32px) 16px 12px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .lbtns { justify-self: start; display: flex; gap: 8px; }
  a.reload-btn { text-decoration: none; }
  .reload-btn { display: grid; place-items: center; width: 40px; height: 40px; border: none; border-radius: 50%; background: var(--chip); color: var(--muted); cursor: pointer; transition: transform .45s cubic-bezier(.2,.8,.2,1), color .2s; }
  .reload-btn:active { transform: rotate(-180deg); color: var(--accent); }
  .title { font-size: 20px; font-weight: 700; justify-self: center; white-space: nowrap; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; justify-content: center; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .tabbar .inner { display: flex; width: 100%; max-width: 560px; }
  .tabbar button { flex: 1; border: none; background: transparent; color: var(--muted); height: 49px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 600; cursor: pointer; transition: color .15s; }
  .tabbar button svg { display: block; }
  .tabbar button.on { color: var(--accent); }
  .tabbar button:active { opacity: .6; }
  .sync-btn { justify-self: end; visibility: hidden; background: var(--chip); color: var(--muted); border: none; border-radius: 20px; padding: 9px 12px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; min-width: 72px; }
  .sync-btn.on { background: var(--accent); color: var(--accentText); }

  .pane { max-width: 560px; margin: 0 auto; }
  .pane[hidden] { display: none; }

  .backupbox { max-width: 560px; margin: 0 auto; padding: 8px 16px 40px; }
  .section-label { font-size: 12px; color: var(--muted); margin: 18px 4px 8px; letter-spacing: 1px; }
  .backup { display: flex; gap: 8px; }
  .backup-btn { flex: 1; text-align: center; background: var(--card); color: var(--text); border: none; border-radius: 12px; padding: 13px 14px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .backup-hint { font-size: 11px; color: var(--muted); margin: 8px 4px 0; line-height: 1.6; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%) translateY(100px); background: var(--text); color: var(--bg); padding: 14px 24px; border-radius: 30px; font-weight: 700; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.3); opacity: 0; transition: all .4s cubic-bezier(.2,.8,.2,1); z-index: 300; pointer-events: none; width: max-content; max-width: min(90vw, 420px); text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
</style>
</head>
<body data-tab="cycle">

<header class="bar">
  <div class="lbtns">
  <button id="reloadBtn" class="reload-btn" title="最新に更新" aria-label="最新に更新">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
  </button>
  <a class="reload-btn" href="https://nemui-neko-zzz.github.io/launcher-app/" title="アプリ一覧へ" aria-label="アプリ一覧へ"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.7"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.7"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.7"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.7"/></svg></a>
  </div>
  <h1 class="title" id="title">そろそろ</h1>
  <button id="syncBtn" class="sync-btn">同期</button>
</header>

<div id="host-cycle" class="pane"></div>
<div id="host-motiv" class="pane" hidden></div>

<div class="backupbox">
  <div class="section-label">バックアップ(そろそろ・とりあえず まとめて)</div>
  <div class="backup">
    <button id="exportBtn" class="backup-btn">書き出し (保存)</button>
    <label class="backup-btn" for="importFile">読み込み (復元)</label>
    <input id="importFile" type="file" accept="application/json,.json" style="display:none">
  </div>
  <div class="backup-hint">1つのファイルに両方入ります。読み込むと両方が戻ります。旧アプリ(そろそろ/とりあえず)で書き出したファイルも読み込めます</div>
</div>

<nav class="tabbar" role="tablist" aria-label="セクション">
  <div class="inner">
    <button id="tab-cycle" data-tab="cycle" role="tab">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg>
      <span>そろそろ</span>
    </button>
    <button id="tab-motiv" data-tab="motiv" role="tab">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M8.2 12.3l2.6 2.6 5-5.3"/></svg>
      <span>とりあえず</span>
    </button>
  </div>
</nav>

<div class="toast" id="toast"></div>

<div class="app">
<div class="wrap">
  <div class="lead">やるたびに記録すると、周期を自動で予測します</div>

  <div id="banner"></div>

  <div class="add">
    <input id="input" class="text" type="text" placeholder="例 爪切り / 美容院" maxlength="40" enterkeyhint="done">
    <input id="guess" class="num" type="number" min="1" max="999" placeholder="周期(任意)">
    <button id="addbtn">＋</button>
  </div>
  <div class="hint">周期は分かれば日数で入れる。空でもOK。記録がたまると自動で上書き予測します</div>

  <div class="section-label">登録した習慣</div>
  <ul id="list"></ul>

  <div class="section-label" id="calLabel" style="display:none">カレンダー</div>
  <div class="calbox" id="calbox" style="display:none">
    <div class="chips" id="chips"></div>
    <div class="chips-hint">習慣名をタップで表示/非表示を切り替え</div>
    <div class="cal-tools">
      <button id="todayBtn" class="today-btn">今日に戻る</button>
    </div>
    <div class="cal-head">
      <button id="prev">‹</button>
      <div class="cal-sel">
        <select id="selYear"></select>
        <select id="selMonth"></select>
      </div>
      <button id="next">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-legend">
      <span><i class="lg"></i>やった日</span>
      <span><i class="lg ring"></i>次の目安</span>
      <span><i class="lg faint"></i>そろそろ</span>
    </div>
  </div>

</div>
<div class="picker-overlay" id="picker" style="display:none">

<!-- Firebase (同期用。読み込めない時はローカルのみで動作) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<script>
function mount(hostId, tplId) {
  const h = document.getElementById(hostId);
  const r = h.attachShadow({ mode: "open" });
  r.appendChild(document.getElementById(tplId).content.cloneNode(true));
  return r;
}

/* ===== そろそろ(中身は元のまま) ===== */
const cycleApi = (function (R) {
  const APP = R.querySelector(".app");
let applyingRemote = false;
const DAY = 86400000;

const PALETTE = ["#5fa8a0","#6c8ebf","#d58a6b","#8aa888","#d6b36a","#c88a9a","#8f8fb3","#6fb3cf"];

function normalize(s) {
  if (!s || typeof s !== "object") s = {};
  if (!Array.isArray(s.tasks)) s.tasks = [];
  s.tasks.forEach((t, i) => {
    if (!Array.isArray(t.logs)) t.logs = [];
    if (!t.color) t.color = PALETTE[i % PALETTE.length];
  });
  return s;
}

let state = normalize(JSON.parse(localStorage.getItem("cycle") || "null"));

// カレンダー表示月(保存しない)
let viewY, viewM;
let hiddenIds = new Set(); // カレンダーで非表示にしている習慣
(function(){ const d = new Date(); viewY = d.getFullYear(); viewM = d.getMonth(); })();

function save() {
  state.updatedAt = Date.now();
  localStorage.setItem("cycle", JSON.stringify(state));
  if (!applyingRemote) pushToCloud();
}
function startOfDay(ms) { const d = new Date(ms); d.setHours(0,0,0,0); return d.getTime(); }
function todayMs() { return startOfDay(Date.now()); }
function fmtDate(ms) { const d = new Date(ms); return (d.getMonth()+1) + "/" + d.getDate(); }
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }

function analyze(t) {
  const logs = t.logs.slice().sort((a,b) => a - b);
  const n = logs.length;
  const last = n ? logs[n-1] : null;
  let cycle = null, samples = 0, estimated = false, recent = null;
  if (n >= 2) {
    const diffs = [];
    for (let i = 1; i < n; i++) diffs.push((startOfDay(logs[i]) - startOfDay(logs[i-1])) / DAY);
    recent = diffs.slice(-4);
    cycle = Math.round(recent.reduce((a,b)=>a+b,0) / recent.length);
    samples = diffs.length; estimated = true;
  } else if (t.guess) { cycle = t.guess; }
  if (cycle !== null && cycle < 1) cycle = 1;

  // 「そろそろ」期間: 記録のばらつき(標準偏差)が小さいほど短くする
  let soonWindow = 0;
  if (cycle !== null) {
    if (recent && recent.length >= 2) {
      const mean = recent.reduce((a,b)=>a+b,0) / recent.length;
      const variance = recent.reduce((s,x)=>s+(x-mean)*(x-mean),0) / recent.length;
      const sd = Math.sqrt(variance);
      soonWindow = Math.round(sd);                 // ばらつき連動
    } else {
      soonWindow = Math.round(cycle * 0.15);        // 情報が少ないときの仮
    }
    // 長くなりすぎないよう、上限は14日(かつ周期の半分)まで
    soonWindow = Math.max(1, Math.min(soonWindow, 14, Math.floor(cycle / 2)));
  }

  let nextDue = null, daysLeft = null, status = "new";
  if (last !== null && cycle !== null) {
    nextDue = startOfDay(last) + cycle * DAY;
    daysLeft = Math.round((nextDue - todayMs()) / DAY);
    if (daysLeft <= 0) status = "over";
    else if (daysLeft <= soonWindow) status = "soon";
    else status = "ok";
  } else if (last !== null) { status = "waiting"; }
  return { logs, n, last, cycle, samples, estimated, nextDue, daysLeft, status, soonWindow };
}

function render() {
  const listEl = R.getElementById("list");
  listEl.innerHTML = "";

  if (state.tasks.length === 0) {
    listEl.innerHTML = '<div class="empty">まだ習慣がありません🌱<br>「爪切り」などを登録して<br>やった日に「今日やった」を押そう</div>';
    renderBanner([]);
    R.getElementById("calLabel").style.display = "none";
    R.getElementById("calbox").style.display = "none";
    return;
  }

  const items = state.tasks.map(t => ({ t, a: analyze(t) }));
  const rank = { over: 0, soon: 1, waiting: 2, ok: 3, new: 4 };
  items.sort((x, y) => {
    const r = rank[x.a.status] - rank[y.a.status];
    if (r !== 0) return r;
    if (x.a.daysLeft !== null && y.a.daysLeft !== null) return x.a.daysLeft - y.a.daysLeft;
    return 0;
  });

  items.forEach(({ t, a }) => listEl.appendChild(makeLi(t, a)));
  renderBanner(items.filter(i => i.a.status === "over" || i.a.status === "soon"));

  R.getElementById("calLabel").style.display = "block";
  R.getElementById("calbox").style.display = "block";
  renderLegend();
  renderCalendar();
}

function renderBanner(dueItems) {
  const el = R.getElementById("banner");
  if (dueItems.length === 0) {
    if (state.tasks.length === 0) { el.innerHTML = ""; el.className = ""; return; }
    el.className = "banner calm";
    el.innerHTML = '<div class="ttl">いまは落ち着いています☕️</div><div class="list">そろそろの習慣はありません</div>';
    return;
  }
  el.className = "banner";
  const lines = dueItems.map(({ t, a }) => {
    if (a.status === "over") { const o = -a.daysLeft; return "・<b>" + esc(t.name) + "</b>　" + (o === 0 ? "今日が目安" : o + "日すぎ"); }
    return "・<b>" + esc(t.name) + "</b>　あと" + a.daysLeft + "日";
  }).join("<br>");
  el.innerHTML = '<div class="ttl">そろそろですよ 👀</div><div class="list">' + lines + '</div>';
}

function esc(s) { return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

function makeLi(t, a) {
  const li = document.createElement("li");
  if (a.status === "over") li.classList.add("over");
  else if (a.status === "soon") li.classList.add("soon");

  const row1 = document.createElement("div");
  row1.className = "row1";
  const cdot = document.createElement("i");
  cdot.className = "cdot"; cdot.style.background = t.color;
  const nameWrap = document.createElement("div");
  nameWrap.className = "namewrap";
  const name = document.createElement("div");
  name.className = "name"; name.textContent = t.name;
  const edit = document.createElement("button");
  edit.className = "edit-btn"; edit.title = "名前を変更"; edit.setAttribute("aria-label", "名前を変更");
  edit.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  edit.onclick = (e) => { e.stopPropagation(); renameTask(t.id); };
  nameWrap.append(name, edit);
  row1.append(cdot, nameWrap);
  // カウントダウン(あと◯日/◯日すぎ)のときだけ右に表示
  if (a.status === "over" || a.status === "soon" || a.status === "ok") {
    const st = document.createElement("div");
    st.className = "status " + a.status;
    st.textContent = statusText(a);
    row1.append(st);
  }
  // 削除は右上
  const del = document.createElement("button");
  del.className = "del-top"; del.textContent = "✕"; del.title = "この習慣を削除";
  del.onclick = (e) => { e.stopPropagation(); removeTask(t.id, t.name); };
  row1.append(del);
  li.appendChild(row1);

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = metaText(a);
  li.appendChild(meta);

  if (a.last !== null && a.cycle !== null) {
    const elapsed = (todayMs() - startOfDay(a.last)) / DAY;
    const ratio = Math.min(1.2, elapsed / a.cycle);
    const track = document.createElement("div");
    track.className = "track";
    const i = document.createElement("i");
    i.style.width = Math.min(100, ratio * 100) + "%";
    i.style.background = a.status === "over" ? "var(--over)" : a.status === "soon" ? "var(--soon)" : "var(--ok)";
    track.appendChild(i);
    li.appendChild(track);
  }

  const actions = document.createElement("div");
  actions.className = "actions";
  const did = document.createElement("button");
  did.className = "btn did"; did.textContent = "記録する";
  did.onclick = (e) => { e.stopPropagation(); logToday(t.id); };
  actions.appendChild(did);
  li.appendChild(actions);

  addlog.appendChild(dateBtn);

  return li;
}

function statusText(a) {
  if (a.status === "over") { const o = -a.daysLeft; return o === 0 ? "今日が目安" : o + "日すぎ"; }
  if (a.status === "soon" || a.status === "ok") return "あと" + a.daysLeft + "日";
  if (a.status === "waiting") return "予測中";
  return "記録なし";
}

function metaText(a) {
  if (a.n === 0) return "まだ記録がありません。やった日に下のボタンを押してください";
  const parts = [];
  parts.push("前回　<b>" + fmtDate(a.last) + "</b>");
  if (a.cycle !== null) {
    if (a.estimated) parts.push("予測周期　<b>約" + a.cycle + "日</b>（" + a.samples + "回ぶんの記録から）");
    else parts.push("設定周期　<b>" + a.cycle + "日</b>（記録がたまると自動予測）");
    parts.push("次の目安　<b>" + fmtDate(a.nextDue) + "</b>");
  } else {
    parts.push("周期　<b>予測中</b>（もう1回やると出ます）");
  }
  return parts.join("　／　");
}

// あるタスクが、ある日(startOfDay)にどんな印かを返す: "logged" | "pred" | "soon" | null
function markFor(t, a, d) {
  if (a.last === null) return null;
  if (t.logs.some(l => startOfDay(l) === d)) return "logged";
  if (!a.cycle) return null;
  const today = todayMs();
  const dueDays = Math.round((startOfDay(a.nextDue) - today) / DAY); // >0:まだ先 0:今日 <0:過ぎた
  const diff = Math.round((d - startOfDay(a.last)) / DAY);

  if (dueDays < 0) {
    // 予測日を過ぎた: 今日から3日ぶんを そろそろ(毎日スライド)。今日より前にはつけない
    const fromToday = Math.round((d - today) / DAY);
    if (fromToday >= 0 && fromToday <= 2) return "soon";
    if (fromToday < 0) return null;
    // 今日より先: 次の周期以降の予測日とその手前
    if (diff % a.cycle === 0) return "pred";
    const toNext = a.cycle - (diff % a.cycle);
    if (toNext <= a.soonWindow) return "soon";
    return null;
  }

  // 予測日まで(まだ過ぎていない): 予測日と、その手前の そろそろ
  if (diff <= 0) return null;
  if (diff % a.cycle === 0) return "pred";
  const toNext = a.cycle - (diff % a.cycle);
  if (toNext <= a.soonWindow) return "soon";
  return null;
}

function renderCalendar() {

  });

  const firstDow = new Date(viewY, viewM, 1).getDay();
  const daysInMonth = new Date(viewY, viewM + 1, 0).getDate();
  const today = todayMs();

  // 各タスクを一度だけ分析しておく
  const anas = state.tasks.filter(t => !hiddenIds.has(t.id)).map(t => ({ t, a: analyze(t) }));

  for (let i = 0; i < firstDow; i++) {
    const c = document.createElement("div"); c.className = "cell blank"; grid.appendChild(c);
  }
  for (let day = 1; day <= daysInMonth; day++) {

    cell.className = "cell" + (d === today ? " today" : "");

    anas.forEach(({ t, a }) => {
      const m = markFor(t, a, d);
      if (!m) return;
      entries.push({ t, mark: m });
      const dot = document.createElement("i");
      dot.className = "dot" + (m === "pred" ? " ring" : m === "soon" ? " faint" : "");
      if (m === "pred") dot.style.borderColor = t.color;

      dots.appendChild(dot);
    });
    if (dots.children.length) cell.appendChild(dots);
    // 印のある日はタップで詳細(記録済み/予測/そろそろ)を開く
    if (entries.length) {

  }
}

function addTask() {

  let guess = parseInt(guessEl.value, 10);

  const color = PALETTE[state.tasks.length % PALETTE.length];

function logToday(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const today = todayMs();
  if (t.logs.some(l => startOfDay(l) === today)) { showToast("今日はもう記録済みです"); return; }
  t.logs.push(Date.now());
  save(); render();
  showToast("記録しました ✅");
  if (navigator.vibrate) navigator.vibrate(25);
}

function logAtDate(id, dateStr) {
  if (!dateStr) { showToast("日付を選んでください"); return; }
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const [y, mo, da] = dateStr.split("-").map(Number);
  const stamp = new Date(y, mo - 1, da, 12, 0, 0).getTime();
  if (startOfDay(stamp) > todayMs()) { showToast("未来の日は記録できません"); return; }
  if (t.logs.some(l => startOfDay(l) === startOfDay(stamp))) { showToast("その日はもう記録済みです"); return; }
  t.logs.push(stamp);
  // 入れた日の月をカレンダーに表示
  viewY = y; viewM = mo - 1;
  save(); render();
  showToast(fmtDate(stamp) + " を記録しました ✅");
}

function removeLog(id, dayMs) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return false;
  const before = t.logs.length;
  t.logs = t.logs.filter(l => startOfDay(l) !== dayMs);
  if (t.logs.length !== before) { save(); return true; }
  return false;
}

/* ===== クラウド同期(ログインは画面上部の共通ボタン。保存先は従来のまま cycle-tracker) ===== */
let fbUser = null, fbDb = null, fbUnsub = null;
function renderSyncUI() {}
function dataDoc() {
  return fbDb.collection("users").doc(fbUser.uid).collection("apps").doc("cycle-tracker");
}
function onAuthChanged(user) {
  fbUser = user;
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  if (user) startSync();
}
function startSync() {
  dataDoc().get().then(snap => {
    const remote = snap.exists ? snap.data() : null;
    const localAt = state.updatedAt || 0;
    const remoteAt = remote ? (remote.updatedAt || 0) : -1;
    if (remote && remoteAt >= localAt) applyRemote(remote);
    else pushToCloud();
    fbUnsub = dataDoc().onSnapshot(s => {
      if (!s.exists) return;
      const r = s.data();
      if ((r.updatedAt || 0) > (state.updatedAt || 0)) applyRemote(r);
    });
  }).catch(e => { console.warn(e); showToast("同期の読み込みに失敗"); });
}
function applyRemote(r) {
  applyingRemote = true;
  const at = r.updatedAt || Date.now();
  state = normalize(r);
  state.updatedAt = at;
  localStorage.setItem("cycle", JSON.stringify(state));
  render();
  applyingRemote = false;
  showToast("同期で最新になりました");
}
function pushToCloud() {
  if (!fbUser || !fbDb) return;
  try { dataDoc().set(JSON.parse(JSON.stringify(state))); }
  catch (e) { console.warn("push failed", e); }
}
return {
  onAuth(user, db) { fbDb = db; onAuthChanged(user); },
  getState() { return state; },
  setState(obj) { state = normalize(obj); save(); render(); }
};

/* ===== とりあえず(中身は元のまま) ===== */
const motivApi = (function (R) {
  const APP = R.querySelector(".app");
const PER_LEVEL = 100;   // 1レベルに必要なポイント
const PER_CLEAR = 10;    // 1クリアでもらえるポイント

// 古いバージョンや読み込んだデータが壊れていても動くよう整える
// tasks: { id, text, target, progress } / log: { id, taskId, text, repNo, target, time }
function normalize(s) {
  if (!s || typeof s !== "object") s = {};
  if (!Array.isArray(s.tasks)) s.tasks = [];
  if (!Array.isArray(s.log)) s.log = [];
  if (typeof s.xp !== "number") s.xp = 0;
  s.tasks.forEach(t => {
    if (typeof t.target !== "number" || t.target < 1) t.target = 1;
    if (typeof t.progress !== "number") t.progress = t.done ? 1 : 0;
  });
  return s;
}

let state = normalize(JSON.parse(localStorage.getItem("motiv") || "null"));
let applyingRemote = false;
let archOpen = localStorage.getItem("motiv_archOpen") !== "0"; // クリア済みを開いているか(端末ごとに覚える)

function save() {
  state.updatedAt = Date.now();
  localStorage.setItem("motiv", JSON.stringify(state));
  if (!applyingRemote) pushToCloud();
}

let toastTimer = null;
function showToast(msg) {
  const toast = R.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
}

function todayCount() {
  const t = new Date().toDateString();
  return state.log.filter(e => new Date(e.time).toDateString() === t).length;
}

function fmtTime(ms) {
  const d = new Date(ms);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const hm = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  return sameDay ? "今日 " + hm : (d.getMonth()+1) + "/" + d.getDate() + " " + hm;
}

function render(skipStatus) {
  const todoEl = R.getElementById("todo");
  const archEl = R.getElementById("arch");
  todoEl.innerHTML = ""; archEl.innerHTML = "";

  // 進行中 = まだ回数が残っているタスク
  const active = state.tasks.filter(t => t.progress < t.target);
  if (active.length === 0) {
    todoEl.innerHTML = '<div class="empty">やることが空です✨<br>上の欄から追加しよう</div>';
  }
  active.forEach(t => todoEl.appendChild(makeActiveLi(t)));

  // アーカイブ = 1回ごとの記録を新しい順に
  const logs = state.log.slice().sort((a,b) => b.time - a.time);

function addTask() {
  const input = R.getElementById("input");
  const targetEl = R.getElementById("target");
  const text = input.value.trim();
  if (!text) return;
  let target = parseInt(targetEl.value, 10);
  if (!target || target < 1) target = 1;
  state.tasks.unshift({ id: Date.now(), text, target, progress: 0 });
  input.value = ""; targetEl.value = "";
  save(); render();
}

let freshLogId = null; // 直前に積んだ記録(光らせる用)

// チェックマーク(線が描かれるアニメ用のSVG)
const CHECK_SVG = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" pathLength="1"/></svg>';
const BURST_COLORS = ["#8f8fff", "#ff8cc0", "#b9a0ff", "#ffb0d6"];

// ポッチを中心に光の粒が放射状に飛ぶ
function burstAt(el, count, spread) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const n = count || 14;
  for (let i = 0; i < n; i++) {
    const p = document.createElement("div");
    const size = 5 + Math.random() * 4;
    p.style.cssText = "position:fixed;left:" + (cx - size / 2) + "px;top:" + (cy - size / 2) + "px;width:" + size + "px;height:" + size + "px;border-radius:50%;pointer-events:none;z-index:60;background:" + BURST_COLORS[i % BURST_COLORS.length];
    APP.appendChild(p);
    const ang = (Math.PI * 2 * i) / n + Math.random() * 0.4;
    const dist = (36 + Math.random() * 34) * (spread || 1);
    p.animate([
      { transform: "translate(0,0) scale(1)", opacity: 1 },
      { transform: "translate(" + Math.cos(ang) * dist + "px," + Math.sin(ang) * dist + "px) scale(.2)", opacity: 0 }
    ], { duration: 520 + Math.random() * 220, easing: "cubic-bezier(.15,.7,.3,1)", fill: "forwards" }).onfinish = () => p.remove();
  }
}

// 「+10」がふわっと浮かぶ
function floatText(el, text) {
  const r = el.getBoundingClientRect();
  const f = document.createElement("div");
  f.textContent = text;
  f.style.cssText = "position:fixed;left:" + (r.left + r.width / 2) + "px;top:" + (r.top - 2) + "px;font-weight:800;font-size:17px;color:#b9b9ff;pointer-events:none;z-index:60;text-shadow:0 2px 8px rgba(0,0,0,.45)";
  APP.appendChild(f);
  f.animate([
    { transform: "translate(-50%, 0) scale(.7)", opacity: 0 },
    { transform: "translate(-50%, -14px) scale(1.15)", opacity: 1, offset: 0.25 },
    { transform: "translate(-50%, -52px) scale(1)", opacity: 0 }
  ], { duration: 900, easing: "cubic-bezier(.2,.8,.3,1)", fill: "forwards" }).onfinish = () => f.remove();
}

function doRep(id, silent) {
  const t = state.tasks.find(x => x.id === id);
  if (!t || t.progress >= t.target) { render(); return; }
  const lvBefore = Math.floor(state.xp / PER_LEVEL);
  t.progress += 1;
  state.xp += PER_CLEAR;
  const levelUp = Math.floor(state.xp / PER_LEVEL) > lvBefore;
  const entry = {
    id: Date.now() + Math.random(),
    taskId: t.id, text: t.text, repNo: t.progress, target: t.target, time: Date.now()
  };
  state.log.push(entry);
  if (!silent) celebrate(t.progress >= t.target);
  freshLogId = entry.id;
  save(); render(levelUp);
  freshLogId = null;
  if (levelUp) { playLevelUp(); return; }
  // 上のレベルのカードを脈打たせる
  const st = R.querySelector(".status");
  if (st) { st.classList.remove("pulse"); void st.offsetWidth; st.classList.add("pulse"); }
}

// レベルアップ演出のタイミング(ms): 押してからバーが伸び始めるまで / 伸びきるまで
// 伸び始め / 伸びる時間(一定の速さ) / 光る時刻(満タンになる瞬間) / 光の長さ / 光りきったあとに止まる時間
const BAR_START = 0, BAR_FILL = 600, BAR_FLASH = 600, FLASH_DUR = 550, HOLD = 100;
let levelUpFlashAt = 0; // 光る予定の時刻

// バーを光らせる(満タンになった瞬間)
function flashBar() {
  const bar = R.getElementById("bar");
  const track = bar.parentElement;
  bar.classList.remove("charged"); void bar.offsetWidth; bar.classList.add("charged");
  track.classList.remove("full"); void track.offsetWidth; track.classList.add("full");
}

// バーを満タンまで伸ばす
function fillBarFull() {
  const bar = R.getElementById("bar");
  // 一定の速さで伸ばす
  bar.style.transition = "width " + BAR_FILL + "ms linear";
  bar.style.width = "100%";
  R.getElementById("xptext").textContent = PER_LEVEL + " / " + PER_LEVEL + " pt";
}

// レベルアップ: 満タンになった瞬間に光が走り、新しいレベルに切り替える
function playLevelUp() {
  const bar = R.getElementById("bar");
  const num = R.getElementById("lvnum");
  const st = R.querySelector(".status");
  const lbl = R.querySelector(".status .lv");
  const track = bar.parentElement;
  fillBarFull(); // 念のため(すでに始まっていれば何も変わらない)
  // 光りきったあと、少し(HOLD)止まってから新しいレベルへ切り替える
  const wait = Math.max(0, levelUpFlashAt + FLASH_DUR + HOLD - performance.now());
  setTimeout(() => {
    // 満タンから空へ巻き戻る動きは見せず、一瞬で切り替える
    bar.classList.remove("charged"); track.classList.remove("full");
    bar.style.transition = "none";
    renderStatus();
    void bar.offsetWidth;
    bar.style.transition = "";
    num.classList.remove("lvup"); void num.offsetWidth; num.classList.add("lvup");
    st.classList.remove("levelup"); void st.offsetWidth; st.classList.add("levelup");
    burstAt(num, 24, 1.8);
    if (navigator.vibrate) navigator.vibrate([20, 40, 20, 40, 60]);
    lbl.textContent = "LEVEL UP!";
    setTimeout(() => { lbl.textContent = "LEVEL"; }, 2000);
  }, wait);
}

function undoRep(logId) {
  const idx = state.log.findIndex(e => e.id === logId);
  if (idx === -1) return;
  const e = state.log[idx];
  state.log.splice(idx, 1);
  state.xp = Math.max(0, state.xp - PER_CLEAR);
  const t = state.tasks.find(x => x.id === e.taskId);
  if (t) t.progress = Math.max(0, t.progress - 1);
  save(); render();
}

// 鉛筆から: タイトルと回数を編集するダイアログ
function editTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  const ov = document.createElement("div");
  ov.className = "modal-overlay";
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML =
    '<div class="modal-title">やることを編集</div>' +
    '<label class="modal-label">タイトル</label>' +
    '<input class="modal-input" id="editText" type="text" maxlength="80">' +
    '<label class="modal-label">回数 (いま ' + t.progress + ' 回済み)</label>' +
    '<input class="modal-input" id="editTarget" type="number" min="1" max="9999">' +
    '<div class="modal-actions">' +
      '<button class="modal-cancel" id="editCancel">キャンセル</button>' +
      '<button class="modal-save" id="editSave">保存</button>' +
    '</div>';
  ov.appendChild(box);
  APP.appendChild(ov);
  const textEl = box.querySelector("#editText");
  const targetEl = box.querySelector("#editTarget");
  textEl.value = t.text;
  targetEl.value = t.target;

  const close = () => ov.remove();
  box.querySelector("#editCancel").onclick = close;
  ov.onclick = (e) => { if (e.target === ov) close(); };
  box.querySelector("#editSave").onclick = () => {
    const text = textEl.value.trim();
    const target = parseInt(targetEl.value, 10);
    if (!text) { showToast("タイトルが空です"); return; }
    if (!target || target < 1) { showToast("回数は1以上にしてください"); return; }
    if (target < t.progress) { showToast("済んだ回数(" + t.progress + ")以上にしてください"); return; }
    t.text = text;
    t.target = target;
    // クリア済みの記録の表示も合わせる
    state.log.forEach(e => { if (e.taskId === t.id) { e.text = text; e.target = target; } });
    save(); render();
    close();
    showToast("変更しました");
  };
}

function removeTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  if (!confirm("「" + t.text + "」を削除しますか？\nクリア済みの記録は残ります")) return;
  state.tasks = state.tasks.filter(x => x.id !== id);
  // クリア済みの記録(ログ)は消さずに残す
  save(); render();
}

function celebrate(completed) {
  const toast = R.getElementById("toast");
  toast.textContent = completed ? "コンプリート🎉 +" + PER_CLEAR + "pt" : "やったね +" + PER_CLEAR + "pt";
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 1400);
  if (navigator.vibrate) navigator.vibrate(completed ? [30,40,60] : 30);
  const colors = ["#6c6cff", "#ff6cab", "#ffd36c", "#6cffb0"];
  const n = completed ? 60 : 14;
  for (let i = 0; i < n; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.transform = "rotate(" + Math.random() * 360 + "deg)";
    APP.appendChild(c);
    const fall = 100 + Math.random() * 20;
    const drift = (Math.random() - 0.5) * 200;
    c.animate([
      { transform: c.style.transform + " translateY(0)", opacity: 1 },
      { transform: "translate(" + drift + "px," + fall + "vh) rotate(720deg)", opacity: 0 }
    ], { duration: 1400 + Math.random() * 600, easing: "cubic-bezier(.2,.6,.4,1)", fill: "forwards" }).onfinish = () => c.remove();
  }
}

/* ===== クラウド同期(ログインは画面上部の共通ボタン。保存先は従来のまま motivation) ===== */
let fbUser = null, fbDb = null, fbUnsub = null;
function renderSyncUI() {}
function dataDoc() {
  return fbDb.collection("users").doc(fbUser.uid).collection("apps").doc("motivation");
}
function onAuthChanged(user) {
  fbUser = user;
  if (fbUnsub) { fbUnsub(); fbUnsub = null; }
  if (user) startSync();
}
function startSync() {
  dataDoc().get().then(snap => {
    const remote = snap.exists ? snap.data() : null;
    const localAt = state.updatedAt || 0;
    const remoteAt = remote ? (remote.updatedAt || 0) : -1;
    if (remote && remoteAt >= localAt) applyRemote(remote);
    else pushToCloud();
    fbUnsub = dataDoc().onSnapshot(s => {
      if (!s.exists) return;
      const r = s.data();
      if ((r.updatedAt || 0) > (state.updatedAt || 0)) applyRemote(r);
    });
  }).catch(e => { console.warn(e); showToast("同期の読み込みに失敗"); });
}
function applyRemote(r) {
  applyingRemote = true;
  const at = r.updatedAt || Date.now();
  state = normalize(r);
  state.updatedAt = at;
  localStorage.setItem("motiv", JSON.stringify(state));
  render();
  applyingRemote = false;
  showToast("同期で最新になりました");
}
function pushToCloud() {
  if (!fbUser || !fbDb) return;
  try { dataDoc().set(JSON.parse(JSON.stringify(state))); }
  catch (e) { console.warn("push failed", e); }
}
return {
  onAuth(user, db) { fbDb = db; onAuthChanged(user); },
  getState() { return state; },
  setState(obj) { state = normalize(obj); save(); render(); }
};

function exportAll() {
  const obj = { app: "task-cadence-app", version: 1, exportedAt: Date.now(), cycle: cycleApi.getState(), motiv: motivApi.getState() };
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  const a = document.createElement("a");
  a.href = url; a.download = "task-cadence-app-backup-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast("書き出しました");
}

// 読み込んだ中身を見て「そろそろ」「とりあえず」のどちらか(または両方)に振り分ける
function classifyBackup(obj) {
  if (!obj || typeof obj !== "object") return null;
  // 新形式(やること): cycle / motiv を持つ
  if (obj.app === "task-cadence-app" || obj.app === "task-cadence" || obj.app === "yarukoto" || (obj.cycle && typeof obj.cycle === "object") || (obj.motiv && typeof obj.motiv === "object")) {
    const r = {};
    if (obj.cycle && Array.isArray(obj.cycle.tasks)) r.cycle = obj.cycle;
    if (obj.motiv && Array.isArray(obj.motiv.tasks)) r.motiv = obj.motiv;
    return (r.cycle || r.motiv) ? r : null;
  }
  // 旧形式(単独のアプリ)
  if (!Array.isArray(obj.tasks)) return null;
  if (Array.isArray(obj.log) || typeof obj.xp === "number" || obj.tasks.some(t => t && "text" in t)) return { motiv: obj };
  if (obj.tasks.some(t => t && ("name" in t || "logs" in t))) return { cycle: obj };
  return null; // タスクが空で見分けがつかない
}

function importAll(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let obj;
    try { obj = JSON.parse(reader.result); }
    catch (e) { showToast("読み込めませんでした (ファイル形式)"); return; }
    const parts = classifyBackup(obj);
    if (!parts) { showToast("バックアップではないか、中身が空で見分けがつきません"); return; }
    const names = [parts.cycle ? "そろそろ" : null, parts.motiv ? "とりあえず" : null].filter(Boolean).join("と");
    if (!confirm("今の「" + names + "」の記録を、読み込んだ内容で置き換えます。よろしいですか？")) return;
    if (parts.cycle) cycleApi.setState(parts.cycle);
    if (parts.motiv) motivApi.setState(parts.motiv);
    showToast("読み込みました ✅(" + names + ")");
  };
  reader.readAsText(file);
}
document.getElementById("exportBtn").onclick = exportAll;
document.getElementById("importFile").onchange = (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) importAll(f);
  e.target.value = "";
};

(function initSync() {
  if (typeof firebase === "undefined") return; // SDK未読込(オフライン等)→ローカルのみ
  let db = null;
  try {
    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged(user => {
      shellUser = user;
      renderSyncUI();
      cycleApi.onAuth(user, db);

    });

function onSyncClick() {
  if (typeof firebase === "undefined") { showToast("同期にはネット接続が必要です"); return; }
  if (shellUser) {
    if (confirm("同期をオフにしますか？（ログアウト）\n記録はこの端末に残ります")) firebase.auth().signOut();
    return;
  }
  const provider = new firebase.auth.GoogleAuthProvider();
  firebase.auth().signInWithPopup(provider).catch(err => {
    const code = err && err.code;
    if (code === "auth/popup-blocked" || code === "auth/cancelled-popup-request" || code === "auth/operation-not-supported-in-this-environment" || code === "auth/popup-closed-by-user") {
      firebase.auth().signInWithRedirect(provider);
    } else {
      console.warn(err);
      showToast("ログインできませんでした");
    }
  });
}
